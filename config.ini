# gc2-usb 0.1.3: output range compensation, not controller calibration.
# Applies after a full Atmosphere restart. Range 60..100. 100 disables it.
# The inner 50% of radial travel remains unchanged.
[sticks]
left_stick_outer_percent=85
right_stick_outer_percent=85

# Optional: 0 disables logs; 1..120 measures for that many seconds after input.
# With 60, rotate each stick fully and hold its four cardinal directions.
# Writes one summary, not a line for each input report.
stick_diagnostics_seconds=0
